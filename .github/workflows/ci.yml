name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist output
        run: |
          echo "=== Build output ==="
          ls -la dist/
          echo "=== Checking key pages ==="
          test -f dist/index.html && echo "✓ index.html"
          test -f dist/about/index.html && echo "✓ about/index.html"
          test -f dist/faq/index.html && echo "✓ faq/index.html"
          test -f dist/contact/index.html && echo "✓ contact/index.html"
          test -f dist/pinewood-derby-info/index.html && echo "✓ pinewood-derby-info/index.html"
          test -f dist/restaurant-night/index.html && echo "✓ restaurant-night/index.html"
          test -f dist/photos/index.html && echo "✓ photos/index.html"
